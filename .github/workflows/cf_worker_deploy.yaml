name: Cloudflare Worker Deploy

on:
  workflow_call:

jobs:
  cf-worker-deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify environment prefix
        if: ${{ !startsWith(github.event.repository.name, 'cf-worker-prd-') && !startsWith(github.event.repository.name, 'cf-worker-dev-') }}
        run: |
          echo "::error::Repository '${GITHUB_REPOSITORY#*/}' does not match any known environment prefix (cf-worker-prd-*, cf-worker-dev-*)."
          exit 1

      - name: Generate a token for accessing private repositories
        id: private-repos-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.READ_ALL_REPOS_CLIENT_ID }}
          private-key: ${{ secrets.APP_READ_ALL_REPOS_PK }}
          owner: ${{ github.repository_owner }}

      - name: Download worker build
        env:
          GH_TOKEN: ${{ steps.private-repos-token.outputs.token }}
        run: |
          source deploy.env
          gh release download "$VERSION" -R "${{ github.repository_owner }}/$SOURCE_REPO" -p index.js --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ startsWith(github.event.repository.name, 'cf-worker-prd-') && secrets.CLOUDFLARE_PRD_API_TOKEN || secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ startsWith(github.event.repository.name, 'cf-worker-prd-') && vars.CLOUDFLARE_PRD_ACCOUNT_ID || vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: npx wrangler deploy index.js --no-bundle
