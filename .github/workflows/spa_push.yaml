name: SPA Push

on:
  workflow_call:

jobs:
  spa-push:
    runs-on: ubuntu-latest

    steps:
      - name: Generate a token for release-please
        id: release-please-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.APP_RELEASE_PLEASE_PK }}

      - uses: googleapis/release-please-action@v5
        id: release_please
        with:
          token: ${{ steps.release-please-token.outputs.token }}
          release-type: node

      - uses: actions/checkout@v7
        if: steps.release_please.outputs.release_created

      - uses: actions/setup-node@v4
        if: steps.release_please.outputs.release_created
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        if: steps.release_please.outputs.release_created
        run: npm ci

      - name: Build
        if: steps.release_please.outputs.release_created
        run: npm run build

      - name: Zip the build
        if: steps.release_please.outputs.release_created
        run: (cd dist && zip -r "../${{ github.event.repository.name }}-${{ steps.release_please.outputs.tag_name }}.zip" .)

      - name: Attach build to the release
        if: steps.release_please.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.release-please-token.outputs.token }}
        run: gh release upload ${{ steps.release_please.outputs.tag_name }} "${{ github.event.repository.name }}-${{ steps.release_please.outputs.tag_name }}.zip"
